<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAConsulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1626;
    --panel:#151F35;
    --panel-2:#1B2740;
    --line:#28324A;
    --paper:#F4F5F1;
    --text:#E8EAF0;
    --text-dim:#8A93A6;
    --accent:#2F8F6B;
    --accent-dim:#1F5E48;
    --amber:#C98A34;
    --rust:#C0503D;
    --radius:14px;
    --radius-sm:9px;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim); color:#fff;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%; max-width:400px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:36px 28px;
  }
  .login-brand{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin-bottom:4px;
  }
  .login-brand span{color:var(--accent);}
  .login-sub{color:var(--text-dim); font-size:13px; margin-bottom:26px;}
  .tab-switch{
    display:flex; background:var(--panel-2); border-radius:999px; padding:3px;
    margin-bottom:24px; border:1px solid var(--line);
  }
  .tab-switch button{
    flex:1; padding:9px 0; border:none; background:none; color:var(--text-dim);
    font-family:var(--font-body); font-weight:600; font-size:13px; border-radius:999px;
    cursor:pointer; transition:.15s;
  }
  .tab-switch button.active{background:var(--accent); color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  .field input{
    width:100%; padding:12px 14px; background:var(--ink); border:1px solid var(--line);
    border-radius:var(--radius-sm); color:var(--text); font-family:var(--font-mono); font-size:14px;
    outline:none; transition:.15s;
  }
  .field input:focus{border-color:var(--accent);}
  .btn-primary{
    width:100%; padding:13px; background:var(--accent); color:#fff; border:none;
    border-radius:var(--radius-sm); font-family:var(--font-body); font-weight:600; font-size:14px;
    cursor:pointer; margin-top:6px; transition:.15s;
  }
  .btn-primary:hover{background:#358066;}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .error-msg{
    color:var(--rust); font-size:13px; margin-top:12px; padding:10px 12px;
    background:rgba(192,80,61,0.1); border-radius:var(--radius-sm); border:1px solid rgba(192,80,61,0.3);
    display:none;
  }

  /* ---------- APP SHELL ---------- */
  #app-screen{display:none; min-height:100vh; padding-bottom:40px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:10;
  }
  .topbar-brand{font-family:var(--font-display); font-weight:600; font-size:18px;}
  .topbar-brand span{color:var(--accent);}
  .topbar-company{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .btn-logout{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:999px; font-size:12px; font-family:var(--font-body);
    cursor:pointer; font-weight:600;
  }
  .container{max-width:760px; margin:0 auto; padding:20px;}

  /* KPI strip */
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;}
  .kpi-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px;
  }
  .kpi-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .kpi-value{font-family:var(--font-mono); font-size:24px; font-weight:600; margin-top:6px;}
  .kpi-delta{font-size:12px; margin-top:4px; font-family:var(--font-mono);}
  .up{color:var(--accent);} .down{color:var(--rust);} .flat{color:var(--text-dim);}

  /* Signature: liquidity gauge */
  .gauge-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; margin-bottom:20px; display:flex; align-items:center; gap:20px;
  }
  .gauge-svg{flex-shrink:0;}
  .gauge-text{flex:1;}
  .gauge-title{font-family:var(--font-display); font-size:17px; font-weight:600; margin-bottom:4px;}
  .gauge-desc{font-size:13px; color:var(--text-dim); line-height:1.5;}

  section.block{margin-bottom:24px;}
  .block-title{
    font-family:var(--font-display); font-size:16px; font-weight:600; margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .list-item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:13px 14px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .li-main{flex:1; min-width:0;}
  .li-title{font-size:13.5px; font-weight:500;}
  .li-sub{font-size:12px; color:var(--text-dim); margin-top:2px; font-family:var(--font-mono);}
  .badge{
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; text-transform:uppercase;
  }
  .badge.pendente{background:rgba(201,138,52,0.15); color:var(--amber);}
  .badge.pago, .badge.aprovado, .badge.concluido{background:rgba(47,143,107,0.15); color:var(--accent);}
  .badge.atrasado, .badge.soon{background:rgba(192,80,61,0.15); color:var(--rust);}

  .bench-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bench-label{width:90px; font-size:12px; color:var(--text-dim); flex-shrink:0;}
  .bench-bar-track{flex:1; height:10px; background:var(--panel-2); border-radius:6px; overflow:hidden;}
  .bench-bar-fill{height:100%; border-radius:6px;}
  .bench-value{width:44px; text-align:right; font-family:var(--font-mono); font-size:12px; flex-shrink:0;}

  .empty-state{color:var(--text-dim); font-size:13px; padding:16px; text-align:center; background:var(--panel); border-radius:var(--radius-sm); border:1px dashed var(--line);}

  /* Admin table */
  .admin-list-item{cursor:pointer;}
  .admin-list-item:active{background:var(--panel-2);}
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:13px; font-weight:600;
    cursor:pointer; margin-bottom:14px; padding:0; font-family:var(--font-body);
  }
  select.estado-select{
    background:var(--ink); color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:5px 8px; font-size:11px; font-family:var(--font-body); font-weight:600;
  }

  .loading{text-align:center; padding:40px 0; color:var(--text-dim); font-size:13px;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">LA<span>Consulting</span></div>
    <div class="login-sub">Contabilidade & Consultoria</div>

    <div class="tab-switch">
      <button id="tab-client" class="active" onclick="switchTab('client')">Cliente</button>
      <button id="tab-admin" onclick="switchTab('admin')">Contabilista</button>
    </div>

    <div id="client-form">
      <div class="field">
        <label>NIF</label>
        <input type="text" id="input-nif" inputmode="numeric" placeholder="000000000" maxlength="9">
      </div>
      <div class="field">
        <label>Código de acesso</label>
        <input type="text" id="input-token" placeholder="0000-0000-0000">
      </div>
      <button class="btn-primary" onclick="doClientLogin()">Entrar</button>
    </div>

    <div id="admin-form" style="display:none;">
      <div class="field">
        <label>Password de administrador</label>
        <input type="password" id="input-admin-password" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="doAdminLogin()">Entrar como administrador</button>
    </div>

    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-screen">
  <div class="topbar">
    <div>
      <div class="topbar-brand">LA<span>Consulting</span></div>
      <div class="topbar-company" id="topbar-company"></div>
    </div>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
  <div class="container" id="app-container">
    <div class="loading">A carregar…</div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — cola aqui o URL da tua implementação Apps Script (/exec)
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbw583SIJGk9RRKL0bablJyM1jPVyPoCehr7o4AIrKh_zogAKmRt1F1tkMlI2bwdkIS0/exec';

/* ---------------- estado da sessão ---------------- */
let session = { mode:null, nif:null, token:null, adminPassword:null };

function switchTab(mode){
  document.getElementById('tab-client').classList.toggle('active', mode==='client');
  document.getElementById('tab-admin').classList.toggle('active', mode==='admin');
  document.getElementById('client-form').style.display = mode==='client' ? 'block' : 'none';
  document.getElementById('admin-form').style.display = mode==='admin' ? 'block' : 'none';
  hideError();
}

function showError(msg){
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError(){
  document.getElementById('login-error').style.display = 'none';
}

async function apiCall(params){
  if(API_URL.indexOf('COLA_AQUI') !== -1){
    throw new Error('Ainda não configuraste o API_URL no topo do <script>. Cola o URL do Web App do Apps Script.');
  }
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(API_URL + '?' + qs);
  if(!res.ok) throw new Error('Falha de rede (' + res.status + ')');
  return res.json();
}

// Para payloads grandes (ex: imagens em base64) que não cabem numa query string.
// Sem cabeçalhos customizados de propósito: assim o pedido conta como "simples" e evita
// problemas de CORS/preflight com o Web App do Apps Script.
async function apiCallPost(bodyObj){
  if(API_URL.indexOf('COLA_AQUI') !== -1){
    throw new Error('Ainda não configuraste o API_URL no topo do <script>.');
  }
  const tentar = async () => {
    const res = await fetch(API_URL, { method:'POST', body: JSON.stringify(bodyObj) });
    if(!res.ok) throw new Error('Falha de rede (' + res.status + ')');
    return res.json();
  };

  const r1 = await tentar();
  // O Web App do Apps Script faz sempre um redirecionamento interno antes de responder, e esse
  // salto ocasionalmente perde o corpo de um pedido POST (mais comum logo a seguir a publicar uma
  // versão nova). Se isso acontecer, o backend cai no "Ação inválida: undefined" — tentamos mais
  // uma vez automaticamente antes de desistir.
  if(!r1.success && String(r1.error||'').indexOf('Ação inválida') !== -1){
    return await tentar();
  }
  return r1;
}

/* ---------------- login cliente ---------------- */
async function doClientLogin(){
  hideError();
  const nif = document.getElementById('input-nif').value.trim();
  const token = document.getElementById('input-token').value.trim();
  if(!nif || !token){ showError('Preenche o NIF e o código de acesso.'); return; }

  try{
    const r = await apiCall({ action:'login', nif, token });
    if(!r.success){ showError(r.error || 'Não foi possível entrar.'); return; }
    session = { mode:'client', nif, token };
    enterApp();
    loadClientDashboard();
  }catch(err){ showError(err.message); }
}

/* ---------------- login admin ---------------- */
async function doAdminLogin(){
  hideError();
  const password = document.getElementById('input-admin-password').value;
  if(!password){ showError('Introduz a password.'); return; }

  try{
    const r = await apiCall({ action:'adminLogin', password });
    if(!r.success){ showError(r.error || 'Password inválida.'); return; }
    session = { mode:'admin', adminPassword: password };
    enterApp();
    loadAdminList();
  }catch(err){ showError(err.message); }
}

function enterApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
}

function logout(){
  session = { mode:null, nif:null, token:null, adminPassword:null };
  chatHistorico = [];
  ocrLotes = {};
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('input-token').value = '';
  document.getElementById('input-admin-password').value = '';
}

/* ===================== DASHBOARD CLIENTE ===================== */
async function loadClientDashboard(){
  const c = document.getElementById('app-container');
  c.innerHTML = '<div class="loading">A carregar dados…</div>';
  try{
    const r = await apiCall({ action:'dashboard', nif:session.nif, token:session.token });
    if(!r.success){ c.innerHTML = '<div class="empty-state">'+ (r.error||'Erro a carregar dados.') +'</div>'; return; }
    document.getElementById('topbar-company').textContent = r.empresa || '';
    c.innerHTML = renderClientDashboard(r);
  }catch(err){
    c.innerHTML = '<div class="empty-state">'+ err.message +'</div>';
  }
}

function fmtEUR(v){
  if(v===undefined || v===null || v==='') return '—';
  const n = Number(v);
  if(isNaN(n)) return v;
  return n.toLocaleString('pt-PT', {maximumFractionDigits:0}) + ' €';
}
function deltaClass(dir){
  if(dir === 'up') return 'up';
  if(dir === 'down') return 'down';
  return 'flat';
}
function deltaArrow(dir){
  if(dir === 'up') return '▲ ';
  if(dir === 'down') return '▼ ';
  return '';
}

function renderClientDashboard(data){
  const m = data.metrics || {};
  const fat = computeFaturacaoSummary(data.vendas);
  const custosInfo = computeCustosSummary(data.itensComprados);
  const margemInfo = computeMargemSummary(fat, custosInfo, m);
  const impostoInfo = computeImpostoEstimado(fat, margemInfo, data.derrama_municipal);
  const saldoInfo = computeSaldoEstimado(data.movimentos, m);
  const runwayMeses = estimateRunway(m, fat, custosInfo, saldoInfo);
  const gauge = renderGauge(runwayMeses);

  const alerts = computeAlerts(data.deadlines, data.movimentos, runwayMeses);

  return `
    ${renderAlerts(alerts)}
    ${renderKpiGridFixed(m, fat, margemInfo, impostoInfo, saldoInfo)}
    ${gauge}
    ${renderOcrUploader()}
    ${renderFiscalChat()}
    ${renderSection('Prazos fiscais', renderDeadlinesHeader(data) + renderDeadlines(data.deadlines))}
    ${renderSection('Movimentos recentes', renderMovimentos(data.movimentos))}
    ${renderSection('Vendas mensais', renderVendas(data.vendas))}
    ${renderTaxEstimator(fat, m, margemInfo, data.derrama_municipal)}
    ${renderSection('Comparação com o setor', renderBenchmark(data.benchmark))}
  `;
}

const MESES_PT_FULL = {
  janeiro:0, fevereiro:1, março:2, marco:2, abril:3, maio:4, junho:5,
  julho:6, agosto:7, setembro:8, outubro:9, novembro:10, dezembro:11
};

// Soma real da faturação a partir da tab VendasMensais (não confia em valores soltos na Metrics,
// que são fáceis de ficar desatualizados). Faturação = soma do ano corrente; se não houver dados
// do ano corrente, soma tudo o que existir. A variação é calculada entre os dois últimos meses reais.
function computeFaturacaoSummary(vendas){
  if(!vendas || !vendas.length) return { total:null, deltaLabel:'', dir:'flat' };

  const anoAtual = new Date().getFullYear();
  const doAno = vendas.filter(v => Number(v.ano) === anoAtual);
  const base = doAno.length ? doAno : vendas;
  const total = base.reduce((s, v) => s + (Number(v.total_faturado) || 0), 0);

  const ordenado = vendas.slice().sort((a, b) => {
    const chaveA = Number(a.ano) * 12 + (MESES_PT_FULL[String(a.mes).toLowerCase()] ?? 0);
    const chaveB = Number(b.ano) * 12 + (MESES_PT_FULL[String(b.mes).toLowerCase()] ?? 0);
    return chaveA - chaveB;
  });

  let deltaLabel = '', dir = 'flat';
  if(ordenado.length >= 2){
    const ultimo = Number(ordenado[ordenado.length - 1].total_faturado) || 0;
    const anterior = Number(ordenado[ordenado.length - 2].total_faturado) || 0;
    if(anterior > 0){
      const pct = Math.round(((ultimo - anterior) / anterior) * 1000) / 10;
      dir = pct > 0 ? 'up' : (pct < 0 ? 'down' : 'flat');
      deltaLabel = `${pct > 0 ? '+' : ''}${pct}% vs mês anterior`;
    }
  }

  return { total, deltaLabel, dir, ultimoMes: ordenado.length ? Number(ordenado[ordenado.length-1].total_faturado)||0 : null };
}

// Custos mensais = soma de ItensComprados (faturas digitalizadas) agrupada por mês, a partir de
// data_compra. Substitui a ideia anterior de uma tab manual "CustosMensais" — os custos aparecem
// à medida que as faturas de compra vão sendo digitalizadas na app. Cobertura parcial: só reflete
// o que já foi carregado, não a totalidade real das despesas da empresa.
function computeCustosSummary(itensComprados){
  if(!itensComprados || !itensComprados.length) return { total:null, ultimoMes:null };

  const porMes = {}; // chave "ano-mesIdx" -> soma
  itensComprados.forEach(it => {
    const data = parseDeadlineDate(it.data_compra);
    if(!data) return; // sem data legível, não entra na soma mensal
    const chave = data.getFullYear() + '-' + data.getMonth();
    porMes[chave] = (porMes[chave] || 0) + (Number(it.valor_total) || 0);
  });

  const chaves = Object.keys(porMes);
  if(!chaves.length) return { total:null, ultimoMes:null };

  const anoAtual = new Date().getFullYear();
  const chavesDoAno = chaves.filter(k => Number(k.split('-')[0]) === anoAtual);
  const baseChaves = chavesDoAno.length ? chavesDoAno : chaves;
  const total = baseChaves.reduce((s, k) => s + porMes[k], 0);

  const chavesOrdenadas = chaves.slice().sort((a, b) => {
    const [anoA, mesA] = a.split('-').map(Number);
    const [anoB, mesB] = b.split('-').map(Number);
    return (anoA*12 + mesA) - (anoB*12 + mesB);
  });
  const ultimaChave = chavesOrdenadas[chavesOrdenadas.length - 1];

  return { total, ultimoMes: porMes[ultimaChave] };
}

// Margem automática = (faturação - custos) / faturação, só quando há dados reais de CustosMensais
// para o mesmo período. Sem isso, cai para o valor manual que o CC já tinha na Metrics (compatível
// com o que já existia antes desta automatização).
function computeMargemSummary(fat, custosInfo, m){
  if(fat.total === null || custosInfo.total === null || fat.total <= 0){
    return {
      pct: m.margem_delta !== undefined ? Number(m.margem_delta) : null,
      dir: m.margem_dir || 'flat',
      label: m.margem_delta_label || '',
      auto: false
    };
  }
  const pct = Math.round(((fat.total - custosInfo.total) / fat.total) * 1000) / 10;

  let dir = 'flat', label = '';
  if(fat.ultimoMes !== null && custosInfo.ultimoMes !== null && fat.ultimoMes > 0){
    const margemUltimoMes = (fat.ultimoMes - custosInfo.ultimoMes) / fat.ultimoMes;
    dir = margemUltimoMes >= (pct/100) ? 'up' : 'down';
    label = 'com base em CustosMensais';
  }

  return { pct, dir, label, auto: true };
}

// Estimativa de IRC reaproveitada do mesmo cálculo da calculadora manual — ver renderTaxEstimator.
// Só preenche automaticamente quando há faturação E margem calculadas; caso contrário cai para o
// valor manual da Metrics (imposto_previsto), tal como antes.
function computeImpostoEstimado(fat, margemInfo, derramaMunicipal){
  if(fat.total === null || margemInfo.pct === null || fat.total <= 0){
    return { total: null, auto: false };
  }
  const materiaEstimada = Math.max(0, fat.total * (margemInfo.pct / 100));
  const derramaPct = Number(derramaMunicipal) || 0;
  const r = computeIRC(materiaEstimada, true, derramaPct); // assume PME por defeito
  return { total: r.total, auto: true };
}

// Saldo estimado a partir dos Movimentos concluídos (vendas somam, compras subtraem). NÃO é o
// saldo bancário real — começa do zero e só reflete o que estiver registado na tab Movimentos.
// Se não houver nenhum movimento concluído, cai para o valor manual da Metrics (saldo_atual).
function computeSaldoEstimado(movimentos, m){
  const concluidos = (movimentos || []).filter(mv => String(mv.estado || '').toLowerCase() === 'concluido');
  if(!concluidos.length){
    return { total: m.saldo_atual !== undefined ? Number(m.saldo_atual) : null, auto: false };
  }
  const total = concluidos.reduce((s, mv) => {
    const valor = Number(mv.valor) || 0;
    if(mv.tipo === 'venda') return s + valor;
    if(mv.tipo === 'compra') return s - valor;
    return s;
  }, 0);
  return { total, auto: true };
}

// KPI grid — usa valores automáticos quando existem, cai para manual (Metrics) caso contrário.
function renderKpiGridFixed(m, fat, margemInfo, impostoInfo, saldoInfo){
  fat = fat || { total:null, deltaLabel:'', dir:'flat' };
  margemInfo = margemInfo || { pct:null, dir:'flat', label:'', auto:false };
  impostoInfo = impostoInfo || { total: m.imposto_previsto, auto:false };
  saldoInfo = saldoInfo || { total: m.saldo_atual, auto:false };

  return `
    <div class="kpi-grid" style="margin-top:-20px;">
      <div class="kpi-card">
        <div class="kpi-label">Faturação (soma real)</div>
        <div class="kpi-value">${fat.total !== null ? fmtEUR(fat.total) : '—'}</div>
        <div class="kpi-delta ${deltaClass(fat.dir)}">${deltaArrow(fat.dir)}${fat.deltaLabel}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Margem${margemInfo.auto ? ' (real)' : ''}</div>
        <div class="kpi-value">${margemInfo.pct !== null ? margemInfo.pct + '%' : '—'}</div>
        <div class="kpi-delta ${deltaClass(margemInfo.dir)}">${deltaArrow(margemInfo.dir)}${margemInfo.label}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Imposto previsto${impostoInfo.auto ? ' (estim.)' : ''}</div>
        <div class="kpi-value">${impostoInfo.total !== null ? fmtEUR(Math.round(impostoInfo.total)) : '—'}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Saldo${saldoInfo.auto ? ' estimado (movimentos)' : ' atual'}</div>
        <div class="kpi-value">${saldoInfo.total !== null && !isNaN(saldoInfo.total) ? fmtEUR(saldoInfo.total) : '—'}</div>
        <div class="kpi-delta flat">${saldoInfo.auto ? 'não é o saldo bancário real' : (m.saldo_atual_data ? 'em ' + m.saldo_atual_data : '')}</div>
      </div>
    </div>
  `;
}

// Meses de fôlego: usa custos reais do último mês se existirem (CustosMensais); senão cai para a
// heurística antiga (60% da faturação do último mês como proxy). Usa o saldo estimado se existir.
function estimateRunway(m, fat, custosInfo, saldoInfo){
  const saldo = saldoInfo && saldoInfo.total !== null ? Number(saldoInfo.total) : Number(m.saldo_atual);
  if(isNaN(saldo)) return null;

  let queimaEstimada;
  if(custosInfo && custosInfo.ultimoMes !== null && custosInfo.ultimoMes > 0){
    queimaEstimada = custosInfo.ultimoMes;
  } else {
    const faturacao = fat && fat.ultimoMes !== null ? fat.ultimoMes : NaN;
    if(isNaN(faturacao) || faturacao <= 0) return null;
    queimaEstimada = faturacao * 0.6;
  }
  if(queimaEstimada <= 0) return null;
  return Math.round((saldo / queimaEstimada) * 10) / 10;
}

/* ---------------- Alertas de tesouraria ----------------
   NOTA: os prazos fiscais vêm sempre da sheet (tab Deadlines), nunca inventados aqui.
   Isto só calcula "quantos dias faltam" a partir da data que o CC lá colocou. */

const MESES_PT = {jan:0, fev:1, mar:2, abr:3, mai:4, jun:5, jul:6, ago:7, set:8, out:9, nov:10, dez:11};

// Tenta interpretar "2026-08-20" (ISO, fiável) ou "20 ago." (sem ano, frágil — assume ano corrente,
// e se isso resultar numa data já muito passada, assume o ano seguinte).
function parseDeadlineDate(str){
  if(!str) return null;
  const s = String(str).trim();

  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return new Date(+iso[1], +iso[2]-1, +iso[3]);

  const ptShort = s.toLowerCase().match(/(\d{1,2})\s*([a-zç]{3,4})/);
  if(ptShort){
    const dia = +ptShort[1];
    const mesKey = ptShort[2].slice(0,3);
    const mes = MESES_PT[mesKey];
    if(mes === undefined) return null;
    const hoje = new Date();
    let ano = hoje.getFullYear();
    let d = new Date(ano, mes, dia);
    const diffDias = (d - hoje) / 86400000;
    if(diffDias < -180) d = new Date(ano + 1, mes, dia); // provavelmente já é do próximo ano
    return d;
  }
  return null;
}

function computeAlerts(deadlines, movimentos, runwayMeses){
  const alerts = [];
  const hoje = new Date(); hoje.setHours(0,0,0,0);

  (deadlines || []).forEach(d => {
    const estado = String(d.estado || '').toLowerCase();
    if(estado === 'pago') return;
    const data = parseDeadlineDate(d.data);
    const nome = d.tipo || d.descricao || 'Obrigação fiscal';
    if(!data){
      return; // data ilegível — não geramos alerta para não arriscar um falso aviso
    }
    const dias = Math.round((data - hoje) / 86400000);
    if(dias < 0){
      alerts.push({ level:'critico', text: `${nome} — prazo terminou há ${Math.abs(dias)} dia(s).` });
    } else if(dias <= 7){
      alerts.push({ level:'atencao', text: `${nome} — vence em ${dias === 0 ? 'hoje' : dias + ' dia(s)'}.` });
    }
  });

  (movimentos || []).forEach(m => {
    const estado = String(m.estado || '').toLowerCase();
    if(m.tipo === 'venda' && estado === 'pendente'){
      const data = parseDeadlineDate(m.data);
      if(data){
        const dias = Math.round((hoje - data) / 86400000);
        if(dias > 30){
          alerts.push({ level:'atencao', text: `Fatura "${m.descricao || 'venda'}" (${fmtEUR(m.valor)}) pendente há ${dias} dias.` });
        }
      }
    }
  });

  if(runwayMeses !== null && runwayMeses < 2){
    alerts.push({ level:'critico', text: `Fôlego de tesouraria estimado abaixo de 2 meses (${runwayMeses}).` });
  }

  return alerts;
}

function renderAlerts(alerts){
  if(!alerts || !alerts.length) return '';
  const items = alerts.map(a => `
    <div class="list-item" style="border-left:3px solid ${a.level==='critico' ? '#C0503D' : '#C98A34'};">
      <div class="li-main"><div class="li-title">${a.text}</div></div>
      <span class="badge ${a.level==='critico' ? 'atrasado' : 'pendente'}">${a.level==='critico' ? 'urgente' : 'atenção'}</span>
    </div>
  `).join('');
  return `<section class="block"><div class="block-title">Alertas</div>${items}</section>`;
}

/* ---------------- Exportação iCal ---------------- */
function renderDeadlinesHeader(data){
  if(!data.deadlines || !data.deadlines.length) return '';
  return `<button class="back-btn" style="margin-bottom:10px;" onclick='exportDeadlinesICS(${JSON.stringify(data.deadlines)}, ${JSON.stringify(data.empresa||"")})'>⤓ Exportar para o calendário (.ics)</button>`;
}

function exportDeadlinesICS(deadlines, empresa){
  const withDates = deadlines
    .filter(d => String(d.estado||'').toLowerCase() !== 'pago')
    .map(d => ({ nome: d.tipo || d.descricao || 'Obrigação fiscal', data: parseDeadlineDate(d.data) }))
    .filter(d => d.data);

  if(!withDates.length){
    alert('Não há prazos com data reconhecível para exportar. Verifica o formato das datas na sheet (recomendado: AAAA-MM-DD).');
    return;
  }

  const pad = n => String(n).padStart(2,'0');
  const dt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;

  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//LAConsulting//Prazos Fiscais//PT\r\n';
  withDates.forEach((d, i) => {
    ics += 'BEGIN:VEVENT\r\n';
    ics += `UID:laconsulting-${dt(d.data)}-${i}@laconsulting\r\n`;
    ics += `DTSTART;VALUE=DATE:${dt(d.data)}\r\n`;
    ics += `SUMMARY:${(empresa ? empresa + ' — ' : '') + d.nome}\r\n`;
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';

  const blob = new Blob([ics], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'prazos-fiscais.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderGauge(meses){
  let color = '#2F8F6B', label = 'Fôlego de tesouraria saudável', desc = 'Sem sinais de aperto de tesouraria no curto prazo.';
  if(meses === null){
    return `<div class="gauge-card">
      <div class="gauge-text">

  if(meses < 2){ color = '#C0503D'; label = 'Fôlego apertado'; desc = 'Menos de 2 meses de fôlego estimado ao ritmo atual. Vale a pena rever prazos de recebimento.'; }
  else if(meses < 4){ color = '#C98A34'; label = 'Fôlego moderado'; desc = 'Entre 2 e 4 meses de fôlego estimado. Vale a pena manter atenção às contas a receber.'; }

          stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
          transform="rotate(-90 60 60)"/>
        <text x="60" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-size="22" font-weight="600" fill="#E8EAF0">${meses}</text>
        <text x="60" y="74" text-anchor="middle" font-family="Inter" font-size="10" fill="#8A93A6">meses</text>
      </svg>

        <div class="gauge-title">${label}</div>

}

/* ===================== OCR de faturas ===================== *
 * O cliente tira/carrega uma foto (ou PDF) de uma fatura de compra. A imagem é redimensionada
 * no browser para não ir pesada, enviada ao backend para leitura pela Gemini, e o resultado
 * aparece num formulário EDITÁVEL — o cliente confirma/corrige antes de qualquer coisa ser
 * gravada em ItensComprados. Nunca gravamos automaticamente o que o OCR "leu". */

let ocrLotes = {}; // id -> { base64, mimeType, dados }
let ocrEmProgresso = false;
let ocrProximoId = 1;

function renderOcrUploader(){
  return `
    <section class="block">
      <div class="block-title">Enviar faturas (leitura automática)</div>
      <div class="list-item" style="flex-direction:column; align-items:stretch; gap:10px;">
        <div class="li-sub">Tira fotos ou carrega PDFs de faturas de compra — podes escolher vários de uma vez. A app lê cada um, e mostra-te os dados para confirmares antes de gravar.</div>
        <input type="file" id="ocr-file-input" accept="image/*,.pdf" multiple style="color:var(--text-dim); font-size:12px;">
        <button class="btn-primary" style="margin-top:0;" onclick="handleOcrFile()">Ler faturas</button>
      </div>
      <div id="ocr-status"></div>
      <div id="ocr-cartoes"></div>
    </section>
  `;
}

// Redimensiona a imagem no browser (máx. 1600px no lado maior, JPEG 82%) antes de enviar,
// para o pedido ficar mais leve e a leitura mais rápida. PDFs seguem sem alteração.
function resizeImageFile(file){
  return new Promise((resolve, reject) => {
    if(file.type === 'application/pdf'){
      const reader = new FileReader();
      reader.onload = () => resolve({ base64: reader.result.split(',')[1], mimeType: 'application/pdf' });
      reader.onerror = () => reject(new Error('Não consegui ler o ficheiro.'));
      reader.readAsDataURL(file);
      return;
    }
    const img = new Image();
    const reader = new FileReader();
    reader.onload = () => {
      img.onload = () => {
        const maxLado = 1600;
        let { width, height } = img;
        if(width > maxLado || height > maxLado){
          const escala = maxLado / Math.max(width, height);
          width = Math.round(width * escala);
          height = Math.round(height * escala);
        }
        const canvas = document.createElement('canvas');
        canvas.width = width; canvas.height = height;
        canvas.getContext('2d').drawImage(img, 0, 0, width, height);
        const dataUrl = canvas.toDataURL('image/jpeg', 0.82);
        resolve({ base64: dataUrl.split(',')[1], mimeType: 'image/jpeg' });
      };
      img.onerror = () => reject(new Error('Não consegui abrir esta imagem.'));
      img.src = reader.result;
    };
    reader.onerror = () => reject(new Error('Não consegui ler o ficheiro.'));
    reader.readAsDataURL(file);
  });
}

// Processa os ficheiros um a um (sequencial de propósito — evita sobrecarregar o Apps Script com
// pedidos em paralelo). Cada ficheiro que falhar mostra o próprio erro e não trava os restantes.
async function handleOcrFile(){
  if(ocrEmProgresso) return;
  const input = document.getElementById('ocr-file-input');
  const status = document.getElementById('ocr-status');
  const cartoes = document.getElementById('ocr-cartoes');
  const ficheiros = Array.from(input.files || []);
  if(!ficheiros.length){ status.innerHTML = '<div class="empty-state">Escolhe pelo menos uma foto ou PDF.</div>'; return; }

  ocrEmProgresso = true;
  let concluidos = 0, falhas = 0;

  for(const file of ficheiros){
    status.innerHTML = `<div class="loading">A ler fatura ${concluidos + falhas + 1} de ${ficheiros.length}…</div>`;
    try{
      const { base64, mimeType } = await resizeImageFile(file);
      const r = await apiCallPost({
        action: 'ocrInvoice',
        nif: session.nif,
        token: session.token,
        image_base64: base64,
        mime_type: mimeType
      });
      if(!r.success){
        falhas++;
        cartoes.innerHTML += `<div class="empty-state">${file.name}: ${r.error || 'não consegui ler.'}</div>`;
        continue;
      }
      const id = 'ocr' + (ocrProximoId++);
      ocrLotes[id] = { base64, mimeType, dados: r.dados };
      cartoes.innerHTML += renderOcrReviewForm(r.dados, id, file.name);
      concluidos++;
    }catch(err){
      falhas++;
      cartoes.innerHTML += `<div class="empty-state">${file.name}: ${err.message}</div>`;
    }
  }

  status.innerHTML = `<div class="li-sub">Lidas ${concluidos} de ${ficheiros.length} fatura(s)${falhas ? ' — ' + falhas + ' falharam' : ''}.</div>`;
  input.value = '';
  ocrEmProgresso = false;
}

function renderOcrReviewForm(dados, id, nomeFicheiro){
  const itens = (dados.itens && dados.itens.length) ? dados.itens : [{
    descricao: dados.categoria || 'Compra',
    quantidade: 1,
    valor_unitario: dados.valor_total || 0,
    valor_total: dados.valor_total || 0
  }];

  const camposComuns = `
    <div class="li-sub" style="margin-bottom:4px; font-weight:600;">${nomeFicheiro || ''}</div>
    <div class="li-sub" style="margin-bottom:8px; color:var(--amber);">Confirma ou corrige os dados antes de gravar — a leitura automática pode errar, sobretudo em números.</div>
    <div class="field"><label>NIF do fornecedor</label><input id="ocr-f-nif-${id}" value="${dados.fornecedor_nif || ''}"></div>
    <div class="field"><label>Nome do fornecedor</label><input id="ocr-f-nome-${id}" value="${dados.fornecedor_nome || ''}"></div>
    <div class="field"><label>Nº da fatura</label><input id="ocr-f-numero-${id}" value="${dados.numero_fatura || ''}"></div>
    <div class="field"><label>Data da compra (AAAA-MM-DD)</label><input id="ocr-f-data-${id}" value="${dados.data_compra || ''}"></div>
    <div class="field"><label>Taxa de IVA (%)</label><input id="ocr-f-iva-${id}" value="${dados.taxa_iva ?? ''}" inputmode="decimal"></div>
    <div class="field"><label>Categoria</label><input id="ocr-f-categoria-${id}" value="${dados.categoria || ''}"></div>
  `;

  const linhasItens = itens.map((it, i) => `
    <div class="list-item" style="flex-direction:column; align-items:stretch; gap:6px;">
      <input class="ocr-item-desc-${id}" data-i="${i}" value="${(it.descricao||'').replace(/"/g,'&quot;')}" placeholder="Descrição">
      <div style="display:flex; gap:8px;">
        <input class="ocr-item-qtd-${id}" data-i="${i}" value="${it.quantidade ?? 1}" placeholder="Qtd" style="width:70px; padding:8px; background:var(--ink); border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:var(--font-mono);">
        <input class="ocr-item-unit-${id}" data-i="${i}" value="${it.valor_unitario ?? ''}" placeholder="Valor unit." style="flex:1; padding:8px; background:var(--ink); border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:var(--font-mono);">
        <input class="ocr-item-total-${id}" data-i="${i}" value="${it.valor_total ?? ''}" placeholder="Total" style="flex:1; padding:8px; background:var(--ink); border:1px solid var(--line); border-radius:8px; color:var(--text); font-family:var(--font-mono);">
      </div>
    </div>
  `).join('');

  return `
    <section class="block" id="ocr-card-${id}" style="border-top:1px solid var(--line); padding-top:16px;">
      ${camposComuns}
      <div class="block-title" style="font-size:14px; margin-top:16px;">Itens</div>
      ${linhasItens}
      <button class="btn-primary" onclick="confirmOcrSave('${id}')">Guardar fatura</button>
      <div id="ocr-resultado-${id}"></div>
    </section>
  `;
}

async function confirmOcrSave(id, forcar){
  const lote = ocrLotes[id];
  if(!lote || ocrEmProgresso) return;
  ocrEmProgresso = true;
  const resultado = document.getElementById('ocr-resultado-' + id);

  const fornecedor_nif = document.getElementById(`ocr-f-nif-${id}`).value.trim();
  const fornecedor_nome = document.getElementById(`ocr-f-nome-${id}`).value.trim();
  const numero_fatura = document.getElementById(`ocr-f-numero-${id}`).value.trim();
  const data_compra = document.getElementById(`ocr-f-data-${id}`).value.trim();
  const taxa_iva = document.getElementById(`ocr-f-iva-${id}`).value.trim();
  const categoria = document.getElementById(`ocr-f-categoria-${id}`).value.trim();

  const descs = Array.from(document.querySelectorAll(`.ocr-item-desc-${id}`));
  const itens = descs.map(el => {
    const i = el.dataset.i;
    const qtd = document.querySelector(`.ocr-item-qtd-${id}[data-i="${i}"]`).value;
    const unit = document.querySelector(`.ocr-item-unit-${id}[data-i="${i}"]`).value;
    const total = document.querySelector(`.ocr-item-total-${id}[data-i="${i}"]`).value;
    return {
      fornecedor_nif, fornecedor_nome, numero_fatura, data_compra,
      descricao: el.value.trim(), tipo: '',
      quantidade: qtd, valor_unitario: unit, valor_total: total,
      taxa_iva, categoria
    };
  });

  resultado.innerHTML = '<div class="loading">A gravar e a enviar ao contabilista…</div>';
  try{
    const r = await apiCallPost({
      action: 'saveItemComprado',
      nif: session.nif,
      token: session.token,
      itens: JSON.stringify(itens),
      image_base64: lote.base64,
      mime_type: lote.mimeType,
      forcar: forcar ? 'true' : 'false'
    });

    if(!r.success && r.duplicado){
      resultado.innerHTML = `
        <div class="empty-state" style="color:var(--amber);">${r.error}</div>
        <button class="btn-primary" style="background:var(--amber);" onclick="confirmOcrSave('${id}', true)">Gravar mesmo assim</button>
      `;
      return;
    }
    if(!r.success) throw new Error(r.error || 'Erro desconhecido');

    delete ocrLotes[id];
    document.getElementById('ocr-card-' + id).innerHTML = '<div class="empty-state">Fatura gravada com sucesso.</div>';
  }catch(err){
    resultado.innerHTML = '<div class="empty-state">Erro ao gravar: ' + err.message + '</div>';
  }finally{
    ocrEmProgresso = false;
  }
}

/* ===================== Assistente de IA fiscal ===================== *
 * O aviso abaixo é fixo e aparece sempre — este assistente dá orientação geral, não é
 * aconselhamento fiscal vinculativo. A instrução que o proíbe de inventar artigos de lei está
 * no backend (Code.gs), não aqui — nunca contornar isso no frontend. */

let chatHistorico = [];
let chatEmProgresso = false;

function renderFiscalChat(){
  return `
    <section class="block">
      <div class="block-title">Assistente fiscal</div>
      <div class="li-sub" style="margin-bottom:10px; padding:10px 12px; background:rgba(201,138,52,0.1); border:1px solid rgba(201,138,52,0.3); border-radius:9px; color:var(--amber);">
        Este assistente dá orientação geral e pode errar, sobretudo em números de artigos, taxas e prazos. Não substitui o teu contabilista certificado — confirma sempre decisões importantes com ele antes de agir.
      </div>

      <div style="display:flex; gap:8px;">

        <button class="btn-primary" style="width:auto; margin-top:0; padding:12px 18px;" onclick="enviarMensagemChat()">Enviar</button>
      </div>

function renderMensagemChat(role, texto){
  const isUser = role === 'user';
  return `
    <div style="align-self:${isUser ? 'flex-end' : 'flex-start'}; max-width:85%; background:${isUser ? 'var(--accent-dim)' : 'var(--panel-2)'}; border:1px solid var(--line); border-radius:12px; padding:10px 13px; font-size:13.5px; line-height:1.5; white-space:pre-wrap;">
      ${texto}
    </div>
  `;
}

async function enviarMensagemChat(){
  if(chatEmProgresso) return;
  const input = document.getElementById('chat-input');
  const texto = input.value.trim();
  if(!texto) return;

  const mensagens = document.getElementById('chat-mensagens');
  chatHistorico.push({ role:'user', text: texto });
  mensagens.innerHTML += renderMensagemChat('user', texto);
  input.value = '';
  mensagens.scrollTop = mensagens.scrollHeight;

  chatEmProgresso = true;
  const idLoading = 'chat-loading-' + Date.now();
  mensagens.innerHTML += `<div id="${idLoading}" style="align-self:flex-start; color:var(--text-dim); font-size:13px;">A pensar…</div>`;
  mensagens.scrollTop = mensagens.scrollHeight;

  try{
    const r = await apiCallPost({
      action:'fiscalChat',
      nif: session.nif,
      token: session.token,
      historico: JSON.stringify(chatHistorico)
    });
    document.getElementById(idLoading).remove();
    if(!r.success){
      mensagens.innerHTML += renderMensagemChat('assistant', 'Erro: ' + (r.error || 'não consegui responder.'));
      return;
    }
    chatHistorico.push({ role:'assistant', text: r.resposta });
    mensagens.innerHTML += renderMensagemChat('assistant', r.resposta);
  }catch(err){
    const el = document.getElementById(idLoading);
    if(el) el.remove();
    mensagens.innerHTML += renderMensagemChat('assistant', 'Erro: ' + err.message);
  }finally{
    chatEmProgresso = false;
    mensagens.scrollTop = mensagens.scrollHeight;
  }
}

function renderBenchmark(b){
  const nota = `<div class="li-sub" style="margin-bottom:10px;">Estes valores vêm da tab "Benchmark" da sheet — não são recolhidos automaticamente. Para preencheres com dados reais de setor, os <a href="https://www.bportugal.pt/page/quadros-da-empresa-e-do-setor" target="_blank" style="color:var(--accent);">Quadros do Setor do Banco de Portugal</a> são gratuitos e comparam empresas por setor de atividade e dimensão.</div>`;

  if(!b || Object.keys(b).length <= 1) return nota + '<div class="empty-state">Sem dados de benchmarking disponíveis.</div>';
  // Assunção: coluna B = valor da tua empresa, coluna C = média do setor, coluna D = unidade (ex: "%")
  const keys = Object.keys(b).filter(k => k !== 'nif' && k !== '_rowIndex');
  if(keys.length < 2) return nota + '<div class="empty-state">Sem dados de benchmarking disponíveis.</div>';
  const empresaVal = Number(b[keys[0]]);
  const setorVal = Number(b[keys[1]]);
  const unidade = b[keys[2]] || '';
  const max = Math.max(empresaVal, setorVal, 1);
  return nota + `
    <div class="bench-row">
      <div class="bench-label">A tua empresa</div>
      <div class="bench-bar-track"><div class="bench-bar-fill" style="width:${Math.round(empresaVal/max*100)}%; background:#2F8F6B;"></div></div>
      <div class="bench-value">${empresaVal}${unidade}</div>
    </div>
    <div class="bench-row">
      <div class="bench-label">Média do setor</div>
      <div class="bench-bar-track"><div class="bench-bar-fill" style="width:${Math.round(setorVal/max*100)}%; background:#8A93A6;"></div></div>
      <div class="bench-value">${setorVal}${unidade}</div>
    </div>
  `;
}

/* ===================== Calculadora de estimativa de IRC ===================== *
 * Taxas confirmadas para períodos de tributação com início em 2026 (Orçamento do Estado 2026):
 * PME/Small Mid Cap: 15% sobre os primeiros 50.000€ de matéria coletável, 19% no remanescente.
 * Empresas não-PME: 19% sobre a totalidade. Derrama municipal: até 1,5%, varia por município —
 * o utilizador tem de indicar a taxa do seu município (consultar Ofício Circulado anual da AT).
 * NÃO calcula tributações autónomas nem derrama estadual (lucros > 1,5M€) — complexo demais para
 * estimar sem dados de despesas detalhados; fica expressamente fora, para não dar um número falso
 * de confiança. Cálculo 100% no browser, sem chamar nenhuma API — não há custo nem risco de dados. */

// Função pura, reaproveitada pela calculadora manual e pelo KPI "Imposto previsto" automático.
function computeIRC(materia, isPme, derramaPct){
  let irc;
  if(isPme){
    const primeiroEscalao = Math.min(materia, 50000);
    const restante = Math.max(0, materia - 50000);
    irc = primeiroEscalao * 0.15 + restante * 0.19;
  } else {
    irc = materia * 0.19;
  }
  const derrama = materia * ((Number(derramaPct) || 0) / 100);
  return { irc, derrama, total: irc + derrama };
}

function renderTaxEstimator(fat, metrics, margemInfo, derramaMunicipal){
  const margemPct = margemInfo && margemInfo.pct !== null ? margemInfo.pct : Number(metrics.margem_delta);
  const lucroEstimado = (fat && fat.total !== null && !isNaN(margemPct))
    ? Math.round(fat.total * (margemPct / 100))
    : '';
  const derramaDefault = derramaMunicipal !== undefined && derramaMunicipal !== null ? derramaMunicipal : 0;

  return `
    <section class="block">
      <div class="block-title">Estimativa de IRC (pré-trimestre)</div>
      <div class="li-sub" style="margin-bottom:10px; padding:10px 12px; background:rgba(201,138,52,0.1); border:1px solid rgba(201,138,52,0.3); border-radius:9px; color:var(--amber);">
        Estimativa aproximada com as taxas de 2026. Não inclui tributações autónomas, benefícios fiscais nem derrama estadual — não substitui o cálculo oficial feito pelo teu contabilista.
      </div>
      <div class="field">
        <label>Matéria coletável estimada (€)</label>
        <input id="irc-materia" type="number" value="${lucroEstimado}" placeholder="Ex: 45000">
      </div>
      <div class="field">
        <label>Derrama municipal (%) — consulta a taxa do teu município</label>
        <input id="irc-derrama" type="number" step="0.1" value="${derramaDefault}" placeholder="Ex: 1.5">
      </div>
      <div style="display:flex; align-items:center; gap:8px; margin-bottom:14px;">
        <input type="checkbox" id="irc-pme" checked style="width:16px; height:16px;">
        <label for="irc-pme" style="font-size:13px; color:var(--text-dim);">A empresa qualifica como PME / Small Mid Cap</label>
      </div>
      <button class="btn-primary" onclick="calcularIRC()">Calcular</button>
      <div id="irc-resultado"></div>
    </section>
  `;
}

function calcularIRC(){
  const materia = Number(document.getElementById('irc-materia').value);
  const derramaPct = Number(document.getElementById('irc-derrama').value) || 0;
  const isPme = document.getElementById('irc-pme').checked;
  const resultado = document.getElementById('irc-resultado');

  if(!materia || materia <= 0){
    resultado.innerHTML = '<div class="empty-state">Indica uma matéria coletável estimada maior que zero.</div>';
    return;
  }

  const r = computeIRC(materia, isPme, derramaPct);

  let avisoEstadual = '';
  if(materia > 1500000){
    avisoEstadual = '<div class="li-sub" style="margin-top:8px; color:var(--amber);">A matéria coletável ultrapassa 1,5M€ — pode aplicar-se também derrama estadual, que esta calculadora não inclui.</div>';
  }

  resultado.innerHTML = `
    <div class="list-item"><div class="li-main"><div class="li-title">IRC (${isPme ? '15%/19% PME' : '19%'})</div></div><div class="li-title">${fmtEUR(Math.round(r.irc))}</div></div>
    <div class="list-item"><div class="li-main"><div class="li-title">Derrama municipal (${derramaPct}%)</div></div><div class="li-title">${fmtEUR(Math.round(r.derrama))}</div></div>
    <div class="list-item" style="border-left:3px solid var(--accent);"><div class="li-main"><div class="li-title">Total estimado</div></div><div class="li-title">${fmtEUR(Math.round(r.total))}</div></div>
    ${avisoEstadual}
  `;
}

/* ===================== IMPORTAÇÃO SAF-T ===================== *
 * Lê o ficheiro no browser (DOMParser), soma os totais por mês a partir de
 * SourceDocuments > SalesInvoices > Invoice, e só envia os totais já calculados
 * para a sheet (nunca o XML inteiro). Notas de crédito (NC) subtraem; faturas
 * anuladas (InvoiceStatus = A) são ignoradas. O SAF-T não distingue "serviços" de
 * "produtos", por isso não inventamos essa divisão — só total_faturado, iva e nº faturas. */

const MESES_NOMES = ['Janeiro','Fevereiro','Março','Abril','Maio','Junho','Julho','Agosto','Setembro','Outubro','Novembro','Dezembro'];
let saftPending = null;

function parseSaftXML(xmlText){
  const doc = new DOMParser().parseFromString(xmlText, 'text/xml');
  if(doc.getElementsByTagName('parsererror').length){
    throw new Error('Ficheiro XML inválido ou corrompido.');
  }
  const getText = (parent, tag) => {
    const el = parent.getElementsByTagName(tag)[0];
    return el ? el.textContent.trim() : '';
  };

  const header = doc.getElementsByTagName('Header')[0];
  if(!header) throw new Error('Não encontrei a secção Header — não parece ser um SAF-T válido.');
  const nif = getText(header, 'CompanyID');
  const nomeEmpresa = getText(header, 'BusinessName') || getText(header, 'CompanyName');

  const invoices = Array.from(doc.getElementsByTagName('Invoice'));
  const porMes = {};

  invoices.forEach(inv => {
    const status = getText(inv, 'InvoiceStatus');
    if(status === 'A') return; // fatura anulada, ignora

    const tipo = getText(inv, 'InvoiceType');
    const sinal = (tipo === 'NC') ? -1 : 1; // nota de crédito subtrai ao total

    const dataStr = getText(inv, 'InvoiceDate'); // AAAA-MM-DD
    const partes = dataStr.split('-');
    if(partes.length < 2) return;
    const ano = Number(partes[0]);
    const mesIdx = Number(partes[1]) - 1;
    if(isNaN(ano) || mesIdx < 0 || mesIdx > 11) return;
    const chave = ano + '-' + mesIdx;

    const totaisEl = inv.getElementsByTagName('DocumentTotals')[0];
    const gross = totaisEl ? Number(getText(totaisEl, 'GrossTotal')) || 0 : 0;
    const tax = totaisEl ? Number(getText(totaisEl, 'TaxPayable')) || 0 : 0;

    if(!porMes[chave]) porMes[chave] = { ano, mesIdx, total:0, iva:0, count:0 };
    porMes[chave].total += gross * sinal;
    porMes[chave].iva += tax * sinal;
    porMes[chave].count += sinal;
  });

  const meses = Object.values(porMes)
    .map(m => ({
      ano: m.ano,
      mes: MESES_NOMES[m.mesIdx],
      total_faturado: Math.round(m.total * 100) / 100,
      iva_liquidado: Math.round(m.iva * 100) / 100,
      numero_faturas: m.count
    }))
    .sort((a,b) => (a.ano*12 + MESES_PT_FULL[a.mes.toLowerCase()]) - (b.ano*12 + MESES_PT_FULL[b.mes.toLowerCase()]));

  return { nif, nomeEmpresa, meses };
}

function renderSaftImporter(nifPrefill){
  return `
    <section class="block">
      <div class="block-title">Importar SAF-T</div>
      <div class="list-item" style="flex-direction:column; align-items:stretch; gap:10px;">
        <div class="li-sub">Carrega o ficheiro SAF-T de faturação (.xml). Os totais são somados por mês e gravados em VendasMensais.</div>
        <input type="file" id="saft-file-input" accept=".xml" style="color:var(--text-dim); font-size:12px;">
        <input type="hidden" id="saft-nif-prefill" value="${nifPrefill || ''}">
        <button class="btn-primary" style="margin-top:0;" onclick="handleSaftFile()">Analisar ficheiro</button>
      </div>
      <div id="saft-preview"></div>
    </section>
  `;
}

async function handleSaftFile(){
  const input = document.getElementById('saft-file-input');
  const preview = document.getElementById('saft-preview');
  if(!input.files.length){ preview.innerHTML = '<div class="empty-state">Escolhe um ficheiro .xml primeiro.</div>'; return; }

  preview.innerHTML = '<div class="loading">A analisar ficheiro…</div>';
  const file = input.files[0];

  let parsed;
  try{
    const text = await file.text();
    parsed = parseSaftXML(text);
  }catch(err){
    preview.innerHTML = '<div class="empty-state">Não consegui ler este ficheiro: ' + err.message + '</div>';
    return;
  }

  if(!parsed.meses.length){
    preview.innerHTML = '<div class="empty-state">Não encontrei faturas válidas neste ficheiro.</div>';
    return;
  }

  const nifPrefillEl = document.getElementById('saft-nif-prefill');
  const nifDestino = (nifPrefillEl && nifPrefillEl.value) ? nifPrefillEl.value : parsed.nif;

  saftPending = { nif: nifDestino, nomeEmpresa: parsed.nomeEmpresa, meses: parsed.meses };

  const rows = parsed.meses.map(m => `
    <div class="list-item">
      <div class="li-main">
        <div class="li-title">${m.mes}/${m.ano}</div>
        <div class="li-sub">${m.numero_faturas} fatura(s) · IVA ${fmtEUR(m.iva_liquidado)}</div>
      </div>
      <div class="li-title">${fmtEUR(m.total_faturado)}</div>
    </div>
  `).join('');

  const avisoNif = nifDestino !== parsed.nif
    ? `<div class="li-sub" style="color:var(--amber); margin-bottom:8px;">Atenção: o ficheiro é da empresa NIF ${parsed.nif}, mas vai ser gravado no cliente NIF ${nifDestino} que tens aberto.</div>`
    : '';

  preview.innerHTML = `
    ${avisoNif}
    ${rows}
    <button class="btn-primary" onclick="confirmSaftImport()">Guardar ${parsed.meses.length} mês(es) na sheet</button>
  `;
}

let saftImportEmProgresso = false;

async function confirmSaftImport(){
  if(!saftPending || saftImportEmProgresso) return;
  saftImportEmProgresso = true;
  const preview = document.getElementById('saft-preview');
  preview.innerHTML = '<div class="loading">A gravar na sheet…</div>';
  try{
    for(const m of saftPending.meses){
      const r = await apiCall({
        action:'importSaftMonth',
        password: session.adminPassword,
        nif: saftPending.nif,
        nome_cliente: saftPending.nomeEmpresa,
        ano: m.ano,
        mes: m.mes,
        total_faturado: m.total_faturado,
        iva_liquidado: m.iva_liquidado,
        numero_faturas: m.numero_faturas
      });
      if(!r.success) throw new Error(r.error || 'Erro desconhecido');
    }
    preview.innerHTML = '<div class="empty-state">Importado com sucesso. Reabre o cliente para veres os valores atualizados.</div>';
    saftPending = null;
  }catch(err){
    preview.innerHTML = '<div class="empty-state">Erro ao gravar: ' + err.message + '</div>';
  } finally {
    saftImportEmProgresso = false;
  }
}
