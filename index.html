<!DOCTYPE html>
<html lang="pt-PT">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>LAConsulting</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#0E1626;
    --panel:#151F35;
    --panel-2:#1B2740;
    --line:#28324A;
    --paper:#F4F5F1;
    --text:#E8EAF0;
    --text-dim:#8A93A6;
    --accent:#2F8F6B;
    --accent-dim:#1F5E48;
    --amber:#C98A34;
    --rust:#C0503D;
    --radius:14px;
    --radius-sm:9px;
    --font-display:'Fraunces', serif;
    --font-body:'Inter', -apple-system, sans-serif;
    --font-mono:'IBM Plex Mono', monospace;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--ink);
    color:var(--text);
    font-family:var(--font-body);
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  ::selection{background:var(--accent-dim); color:#fff;}

  /* ---------- LOGIN ---------- */
  #login-screen{
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:24px;
  }
  .login-card{
    width:100%; max-width:400px;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:var(--radius);
    padding:36px 28px;
  }
  .login-brand{
    font-family:var(--font-display);
    font-weight:600;
    font-size:26px;
    letter-spacing:-0.01em;
    margin-bottom:4px;
  }
  .login-brand span{color:var(--accent);}
  .login-sub{color:var(--text-dim); font-size:13px; margin-bottom:26px;}
  .tab-switch{
    display:flex; background:var(--panel-2); border-radius:999px; padding:3px;
    margin-bottom:24px; border:1px solid var(--line);
  }
  .tab-switch button{
    flex:1; padding:9px 0; border:none; background:none; color:var(--text-dim);
    font-family:var(--font-body); font-weight:600; font-size:13px; border-radius:999px;
    cursor:pointer; transition:.15s;
  }
  .tab-switch button.active{background:var(--accent); color:#fff;}
  .field{margin-bottom:14px;}
  .field label{display:block; font-size:12px; color:var(--text-dim); margin-bottom:6px; font-weight:500;}
  .field input{
    width:100%; padding:12px 14px; background:var(--ink); border:1px solid var(--line);
    border-radius:var(--radius-sm); color:var(--text); font-family:var(--font-mono); font-size:14px;
    outline:none; transition:.15s;
  }
  .field input:focus{border-color:var(--accent);}
  .btn-primary{
    width:100%; padding:13px; background:var(--accent); color:#fff; border:none;
    border-radius:var(--radius-sm); font-family:var(--font-body); font-weight:600; font-size:14px;
    cursor:pointer; margin-top:6px; transition:.15s;
  }
  .btn-primary:hover{background:#358066;}
  .btn-primary:disabled{opacity:.5; cursor:default;}
  .error-msg{
    color:var(--rust); font-size:13px; margin-top:12px; padding:10px 12px;
    background:rgba(192,80,61,0.1); border-radius:var(--radius-sm); border:1px solid rgba(192,80,61,0.3);
    display:none;
  }

  /* ---------- APP SHELL ---------- */
  #app-screen{display:none; min-height:100vh; padding-bottom:40px;}
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:18px 20px; border-bottom:1px solid var(--line); background:var(--panel);
    position:sticky; top:0; z-index:10;
  }
  .topbar-brand{font-family:var(--font-display); font-weight:600; font-size:18px;}
  .topbar-brand span{color:var(--accent);}
  .topbar-company{font-size:12px; color:var(--text-dim); margin-top:2px;}
  .btn-logout{
    background:none; border:1px solid var(--line); color:var(--text-dim);
    padding:8px 14px; border-radius:999px; font-size:12px; font-family:var(--font-body);
    cursor:pointer; font-weight:600;
  }
  .container{max-width:760px; margin:0 auto; padding:20px;}

  /* KPI strip */
  .kpi-grid{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-bottom:20px;}
  .kpi-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px;
  }
  .kpi-label{font-size:11px; color:var(--text-dim); text-transform:uppercase; letter-spacing:.04em; font-weight:600;}
  .kpi-value{font-family:var(--font-mono); font-size:24px; font-weight:600; margin-top:6px;}
  .kpi-delta{font-size:12px; margin-top:4px; font-family:var(--font-mono);}
  .up{color:var(--accent);} .down{color:var(--rust);} .flat{color:var(--text-dim);}

  /* Signature: liquidity gauge */
  .gauge-card{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:22px; margin-bottom:20px; display:flex; align-items:center; gap:20px;
  }
  .gauge-svg{flex-shrink:0;}
  .gauge-text{flex:1;}
  .gauge-title{font-family:var(--font-display); font-size:17px; font-weight:600; margin-bottom:4px;}
  .gauge-desc{font-size:13px; color:var(--text-dim); line-height:1.5;}

  section.block{margin-bottom:24px;}
  .block-title{
    font-family:var(--font-display); font-size:16px; font-weight:600; margin-bottom:12px;
    display:flex; align-items:center; justify-content:space-between;
  }
  .list-item{
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius-sm);
    padding:13px 14px; margin-bottom:8px; display:flex; align-items:center; justify-content:space-between; gap:10px;
  }
  .li-main{flex:1; min-width:0;}
  .li-title{font-size:13.5px; font-weight:500;}
  .li-sub{font-size:12px; color:var(--text-dim); margin-top:2px; font-family:var(--font-mono);}
  .badge{
    font-size:11px; font-weight:700; padding:4px 9px; border-radius:999px; white-space:nowrap; text-transform:uppercase;
  }
  .badge.pendente{background:rgba(201,138,52,0.15); color:var(--amber);}
  .badge.pago, .badge.aprovado{background:rgba(47,143,107,0.15); color:var(--accent);}
  .badge.atrasado, .badge.soon{background:rgba(192,80,61,0.15); color:var(--rust);}

  .bench-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
  .bench-label{width:90px; font-size:12px; color:var(--text-dim); flex-shrink:0;}
  .bench-bar-track{flex:1; height:10px; background:var(--panel-2); border-radius:6px; overflow:hidden;}
  .bench-bar-fill{height:100%; border-radius:6px;}
  .bench-value{width:44px; text-align:right; font-family:var(--font-mono); font-size:12px; flex-shrink:0;}

  .empty-state{color:var(--text-dim); font-size:13px; padding:16px; text-align:center; background:var(--panel); border-radius:var(--radius-sm); border:1px dashed var(--line);}

  /* Admin table */
  .admin-list-item{cursor:pointer;}
  .admin-list-item:active{background:var(--panel-2);}
  .back-btn{
    background:none; border:none; color:var(--accent); font-size:13px; font-weight:600;
    cursor:pointer; margin-bottom:14px; padding:0; font-family:var(--font-body);
  }
  select.estado-select{
    background:var(--ink); color:var(--text); border:1px solid var(--line); border-radius:6px;
    padding:5px 8px; font-size:11px; font-family:var(--font-body); font-weight:600;
  }

  .loading{text-align:center; padding:40px 0; color:var(--text-dim); font-size:13px;}
</style>
</head>
<body>

<!-- ===================== LOGIN ===================== -->
<div id="login-screen">
  <div class="login-card">
    <div class="login-brand">LA<span>Consulting</span></div>
    <div class="login-sub">Contabilidade & Consultoria</div>

    <div class="tab-switch">
      <button id="tab-client" class="active" onclick="switchTab('client')">Cliente</button>
      <button id="tab-admin" onclick="switchTab('admin')">Contabilista</button>
    </div>

    <div id="client-form">
      <div class="field">
        <label>NIF</label>
        <input type="text" id="input-nif" inputmode="numeric" placeholder="000000000" maxlength="9">
      </div>
      <div class="field">
        <label>Código de acesso</label>
        <input type="text" id="input-token" placeholder="0000-0000-0000">
      </div>
      <button class="btn-primary" onclick="doClientLogin()">Entrar</button>
    </div>

    <div id="admin-form" style="display:none;">
      <div class="field">
        <label>Password de administrador</label>
        <input type="password" id="input-admin-password" placeholder="••••••••">
      </div>
      <button class="btn-primary" onclick="doAdminLogin()">Entrar como administrador</button>
    </div>

    <div class="error-msg" id="login-error"></div>
  </div>
</div>

<!-- ===================== APP ===================== -->
<div id="app-screen">
  <div class="topbar">
    <div>
      <div class="topbar-brand">LA<span>Consulting</span></div>
      <div class="topbar-company" id="topbar-company"></div>
    </div>
    <button class="btn-logout" onclick="logout()">Sair</button>
  </div>
  <div class="container" id="app-container">
    <div class="loading">A carregar…</div>
  </div>
</div>

<script>
/* =====================================================================
   CONFIGURAÇÃO — cola aqui o URL da tua implementação Apps Script (/exec)
   ===================================================================== */
const API_URL = 'https://script.google.com/macros/s/AKfycbw583SIJGk9RRKL0bablJyM1jPVyPoCehr7o4AIrKh_zogAKmRt1F1tkMlI2bwdkIS0/exec';

/* ---------------- estado da sessão ---------------- */
let session = { mode:null, nif:null, token:null, adminPassword:null };

function switchTab(mode){
  document.getElementById('tab-client').classList.toggle('active', mode==='client');
  document.getElementById('tab-admin').classList.toggle('active', mode==='admin');
  document.getElementById('client-form').style.display = mode==='client' ? 'block' : 'none';
  document.getElementById('admin-form').style.display = mode==='admin' ? 'block' : 'none';
  hideError();
}

function showError(msg){
  const el = document.getElementById('login-error');
  el.textContent = msg;
  el.style.display = 'block';
}
function hideError(){
  document.getElementById('login-error').style.display = 'none';
}

async function apiCall(params){
  if(API_URL.indexOf('COLA_AQUI') !== -1){
    throw new Error('Ainda não configuraste o API_URL no topo do <script>. Cola o URL do Web App do Apps Script.');
  }
  const qs = new URLSearchParams(params).toString();
  const res = await fetch(API_URL + '?' + qs);
  if(!res.ok) throw new Error('Falha de rede (' + res.status + ')');
  return res.json();
}

/* ---------------- login cliente ---------------- */
async function doClientLogin(){
  hideError();
  const nif = document.getElementById('input-nif').value.trim();
  const token = document.getElementById('input-token').value.trim();
  if(!nif || !token){ showError('Preenche o NIF e o código de acesso.'); return; }

  try{
    const r = await apiCall({ action:'login', nif, token });
    if(!r.success){ showError(r.error || 'Não foi possível entrar.'); return; }
    session = { mode:'client', nif, token };
    enterApp();
    loadClientDashboard();
  }catch(err){ showError(err.message); }
}

/* ---------------- login admin ---------------- */
async function doAdminLogin(){
  hideError();
  const password = document.getElementById('input-admin-password').value;
  if(!password){ showError('Introduz a password.'); return; }

  try{
    const r = await apiCall({ action:'adminLogin', password });
    if(!r.success){ showError(r.error || 'Password inválida.'); return; }
    session = { mode:'admin', adminPassword: password };
    enterApp();
    loadAdminList();
  }catch(err){ showError(err.message); }
}

function enterApp(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('app-screen').style.display = 'block';
}

function logout(){
  session = { mode:null, nif:null, token:null, adminPassword:null };
  document.getElementById('login-screen').style.display = 'flex';
  document.getElementById('app-screen').style.display = 'none';
  document.getElementById('input-token').value = '';
  document.getElementById('input-admin-password').value = '';
}

/* ===================== DASHBOARD CLIENTE ===================== */
async function loadClientDashboard(){
  const c = document.getElementById('app-container');
  c.innerHTML = '<div class="loading">A carregar dados…</div>';
  try{
    const r = await apiCall({ action:'dashboard', nif:session.nif, token:session.token });
    if(!r.success){ c.innerHTML = '<div class="empty-state">'+ (r.error||'Erro a carregar dados.') +'</div>'; return; }
    document.getElementById('topbar-company').textContent = r.empresa || '';
    c.innerHTML = renderClientDashboard(r);
  }catch(err){
    c.innerHTML = '<div class="empty-state">'+ err.message +'</div>';
  }
}

function fmtEUR(v){
  if(v===undefined || v===null || v==='') return '—';
  const n = Number(v);
  if(isNaN(n)) return v;
  return n.toLocaleString('pt-PT', {maximumFractionDigits:0}) + ' €';
}
function deltaClass(dir){
  if(dir === 'up') return 'up';
  if(dir === 'down') return 'down';
  return 'flat';
}
function deltaArrow(dir){
  if(dir === 'up') return '▲ ';
  if(dir === 'down') return '▼ ';
  return '';
}

function renderClientDashboard(data){
  const m = data.metrics || {};
  const runwayMeses = estimateRunway(m); // heurística simples, ver função abaixo
  const gauge = renderGauge(runwayMeses);

  const alerts = computeAlerts(data.deadlines, data.movimentos, runwayMeses);

  return `
    ${renderAlerts(alerts)}
    ${renderKpiGridFixed(m)}
    ${gauge}
    ${renderSection('Prazos fiscais', renderDeadlinesHeader(data) + renderDeadlines(data.deadlines))}
    ${renderSection('Movimentos recentes', renderMovimentos(data.movimentos))}
    ${renderSection('Vendas mensais', renderVendas(data.vendas))}
    ${renderSection('Comparação com o setor', renderBenchmark(data.benchmark))}
  `;
}

// KPI grid corrigido (a versão acima tinha um placeholder — esta é a que efetivamente conta)
function renderKpiGridFixed(m){
  return `
    <div class="kpi-grid" style="margin-top:-20px;">
      <div class="kpi-card">
        <div class="kpi-label">Faturação</div>
        <div class="kpi-value">${m.faturacao_delta !== undefined ? fmtEUR(m.faturacao_delta) : '—'}</div>
        <div class="kpi-delta ${deltaClass(m.faturacao_dir)}">${deltaArrow(m.faturacao_dir)}${m.faturacao_delta_label || ''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Margem</div>
        <div class="kpi-value">${m.margem_delta !== undefined ? m.margem_delta + '%' : '—'}</div>
        <div class="kpi-delta ${deltaClass(m.margem_dir)}">${deltaArrow(m.margem_dir)}${m.margem_delta_label || ''}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Imposto previsto</div>
        <div class="kpi-value">${fmtEUR(m.imposto_previsto)}</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-label">Saldo atual</div>
        <div class="kpi-value">${fmtEUR(m.saldo_atual)}</div>
        <div class="kpi-delta flat">${m.saldo_atual_data ? 'em ' + m.saldo_atual_data : ''}</div>
      </div>
    </div>
  `;
}

// Heurística simples para meses de fôlego: saldo_atual / (faturacao_delta em falta de custos reais).
// Isto é um placeholder honesto: sem uma coluna explícita de "custos_mensais" na sheet, não dá para
// calcular um runway rigoroso. Assumi aqui uma taxa de queima = 60% da faturação do mês como proxy.
// AVISO PARA O LUIS: substitui isto por um cálculo real assim que tiveres custos mensais na Metrics.
function estimateRunway(m){
  const saldo = Number(m.saldo_atual);
  const faturacao = Number(m.faturacao_delta);
  if(isNaN(saldo) || isNaN(faturacao) || faturacao <= 0) return null;
  const queimaEstimada = faturacao * 0.6;
  if(queimaEstimada <= 0) return null;
  return Math.round((saldo / queimaEstimada) * 10) / 10;
}

/* ---------------- Alertas de tesouraria ----------------
   NOTA: os prazos fiscais vêm sempre da sheet (tab Deadlines), nunca inventados aqui.
   Isto só calcula "quantos dias faltam" a partir da data que o CC lá colocou. */

const MESES_PT = {jan:0, fev:1, mar:2, abr:3, mai:4, jun:5, jul:6, ago:7, set:8, out:9, nov:10, dez:11};

// Tenta interpretar "2026-08-20" (ISO, fiável) ou "20 ago." (sem ano, frágil — assume ano corrente,
// e se isso resultar numa data já muito passada, assume o ano seguinte).
function parseDeadlineDate(str){
  if(!str) return null;
  const s = String(str).trim();

  const iso = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if(iso) return new Date(+iso[1], +iso[2]-1, +iso[3]);

  const ptShort = s.toLowerCase().match(/(\d{1,2})\s*([a-zç]{3,4})/);
  if(ptShort){
    const dia = +ptShort[1];
    const mesKey = ptShort[2].slice(0,3);
    const mes = MESES_PT[mesKey];
    if(mes === undefined) return null;
    const hoje = new Date();
    let ano = hoje.getFullYear();
    let d = new Date(ano, mes, dia);
    const diffDias = (d - hoje) / 86400000;
    if(diffDias < -180) d = new Date(ano + 1, mes, dia); // provavelmente já é do próximo ano
    return d;
  }
  return null;
}

function computeAlerts(deadlines, movimentos, runwayMeses){
  const alerts = [];
  const hoje = new Date(); hoje.setHours(0,0,0,0);

  (deadlines || []).forEach(d => {
    const estado = String(d.estado || '').toLowerCase();
    if(estado === 'pago') return;
    const data = parseDeadlineDate(d.data);
    const nome = d.tipo || d.descricao || 'Obrigação fiscal';
    if(!data){
      return; // data ilegível — não geramos alerta para não arriscar um falso aviso
    }
    const dias = Math.round((data - hoje) / 86400000);
    if(dias < 0){
      alerts.push({ level:'critico', text: `${nome} — prazo terminou há ${Math.abs(dias)} dia(s).` });
    } else if(dias <= 7){
      alerts.push({ level:'atencao', text: `${nome} — vence em ${dias === 0 ? 'hoje' : dias + ' dia(s)'}.` });
    }
  });

  (movimentos || []).forEach(m => {
    const estado = String(m.estado || '').toLowerCase();
    if(m.tipo === 'venda' && estado === 'pendente'){
      const data = parseDeadlineDate(m.data);
      if(data){
        const dias = Math.round((hoje - data) / 86400000);
        if(dias > 30){
          alerts.push({ level:'atencao', text: `Fatura "${m.descricao || 'venda'}" (${fmtEUR(m.valor)}) pendente há ${dias} dias.` });
        }
      }
    }
  });

  if(runwayMeses !== null && runwayMeses < 2){
    alerts.push({ level:'critico', text: `Fôlego de tesouraria estimado abaixo de 2 meses (${runwayMeses}).` });
  }

  return alerts;
}

function renderAlerts(alerts){
  if(!alerts || !alerts.length) return '';
  const items = alerts.map(a => `
    <div class="list-item" style="border-left:3px solid ${a.level==='critico' ? '#C0503D' : '#C98A34'};">
      <div class="li-main"><div class="li-title">${a.text}</div></div>
      <span class="badge ${a.level==='critico' ? 'atrasado' : 'pendente'}">${a.level==='critico' ? 'urgente' : 'atenção'}</span>
    </div>
  `).join('');
  return `<section class="block"><div class="block-title">Alertas</div>${items}</section>`;
}

/* ---------------- Exportação iCal ---------------- */
function renderDeadlinesHeader(data){
  if(!data.deadlines || !data.deadlines.length) return '';
  return `<button class="back-btn" style="margin-bottom:10px;" onclick='exportDeadlinesICS(${JSON.stringify(data.deadlines)}, ${JSON.stringify(data.empresa||"")})'>⤓ Exportar para o calendário (.ics)</button>`;
}

function exportDeadlinesICS(deadlines, empresa){
  const withDates = deadlines
    .filter(d => String(d.estado||'').toLowerCase() !== 'pago')
    .map(d => ({ nome: d.tipo || d.descricao || 'Obrigação fiscal', data: parseDeadlineDate(d.data) }))
    .filter(d => d.data);

  if(!withDates.length){
    alert('Não há prazos com data reconhecível para exportar. Verifica o formato das datas na sheet (recomendado: AAAA-MM-DD).');
    return;
  }

  const pad = n => String(n).padStart(2,'0');
  const dt = d => `${d.getFullYear()}${pad(d.getMonth()+1)}${pad(d.getDate())}`;

  let ics = 'BEGIN:VCALENDAR\r\nVERSION:2.0\r\nPRODID:-//LAConsulting//Prazos Fiscais//PT\r\n';
  withDates.forEach((d, i) => {
    ics += 'BEGIN:VEVENT\r\n';
    ics += `UID:laconsulting-${dt(d.data)}-${i}@laconsulting\r\n`;
    ics += `DTSTART;VALUE=DATE:${dt(d.data)}\r\n`;
    ics += `SUMMARY:${(empresa ? empresa + ' — ' : '') + d.nome}\r\n`;
    ics += 'END:VEVENT\r\n';
  });
  ics += 'END:VCALENDAR\r\n';

  const blob = new Blob([ics], { type:'text/calendar;charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'prazos-fiscais.ics';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
}

function renderGauge(meses){
  let color = '#2F8F6B', label = 'Fôlego de tesouraria saudável', desc = 'Sem sinais de aperto de tesouraria no curto prazo.';
  if(meses === null){
    return `<div class="gauge-card">
      <div class="gauge-text">
        <div class="gauge-title">Fôlego de tesouraria</div>
        <div class="gauge-desc">Ainda não há dados suficientes na sheet (Metrics) para calcular este indicador.</div>
      </div>
    </div>`;
  }
  if(meses < 2){ color = '#C0503D'; label = 'Fôlego apertado'; desc = 'Menos de 2 meses de fôlego estimado ao ritmo atual. Vale a pena rever prazos de recebimento.'; }
  else if(meses < 4){ color = '#C98A34'; label = 'Fôlego moderado'; desc = 'Entre 2 e 4 meses de fôlego estimado. Vale a pena manter atenção às contas a receber.'; }

  const pct = Math.min(meses / 6, 1); // satura visualmente aos 6 meses
  const circumference = 2 * Math.PI * 52;
  const offset = circumference * (1 - pct);

  return `
    <div class="gauge-card">
      <svg class="gauge-svg" width="120" height="120" viewBox="0 0 120 120">
        <circle cx="60" cy="60" r="52" fill="none" stroke="#1B2740" stroke-width="10"/>
        <circle cx="60" cy="60" r="52" fill="none" stroke="${color}" stroke-width="10"
          stroke-linecap="round" stroke-dasharray="${circumference}" stroke-dashoffset="${offset}"
          transform="rotate(-90 60 60)"/>
        <text x="60" y="56" text-anchor="middle" font-family="IBM Plex Mono" font-size="22" font-weight="600" fill="#E8EAF0">${meses}</text>
        <text x="60" y="74" text-anchor="middle" font-family="Inter" font-size="10" fill="#8A93A6">meses</text>
      </svg>
      <div class="gauge-text">
        <div class="gauge-title">${label}</div>
        <div class="gauge-desc">${desc}<br><span style="opacity:.6; font-size:11px;">Estimativa aproximada — não substitui análise do teu contabilista.</span></div>
      </div>
    </div>
  `;
}

function renderSection(title, innerHtml){
  return `<section class="block"><div class="block-title">${title}</div>${innerHtml}</section>`;
}

function renderDeadlines(deadlines){
  if(!deadlines || !deadlines.length) return '<div class="empty-state">Sem prazos fiscais registados.</div>';
  return deadlines.map(d => {
    const estado = String(d.estado || 'pendente').toLowerCase();
    return `<div class="list-item">
      <div class="li-main">
        <div class="li-title">${d.tipo || d.descricao || 'Obrigação fiscal'}</div>
        <div class="li-sub">${d.data || ''}</div>
      </div>
      <span class="badge ${estado}">${estado}</span>
    </div>`;
  }).join('');
}

function renderMovimentos(movimentos){
  if(!movimentos || !movimentos.length) return '<div class="empty-state">Sem movimentos recentes.</div>';
  return movimentos.slice().reverse().map(m => {
    const estado = String(m.estado || 'pendente').toLowerCase();
    return `<div class="list-item">
      <div class="li-main">
        <div class="li-title">${m.descricao || (m.tipo === 'venda' ? 'Venda' : 'Compra')}</div>
        <div class="li-sub">${m.data || ''} · ${fmtEUR(m.valor)}</div>
      </div>
      <span class="badge ${estado}">${estado}</span>
    </div>`;
  }).join('');
}

function renderVendas(vendas){
  if(!vendas || !vendas.length) return '<div class="empty-state">Sem vendas mensais registadas.</div>';
  const max = Math.max(...vendas.map(v => Number(v.total_faturado) || 0), 1);
  return vendas.map(v => {
    const pct = Math.round(((Number(v.total_faturado)||0) / max) * 100);
    return `<div class="bench-row">
      <div class="bench-label">${(v.mes||'')}/${v.ano||''}</div>
      <div class="bench-bar-track"><div class="bench-bar-fill" style="width:${pct}%; background:#2F8F6B;"></div></div>
      <div class="bench-value">${fmtEUR(v.total_faturado)}</div>
    </div>`;
  }).join('');
}

function renderBenchmark(b){
  if(!b || Object.keys(b).length <= 1) return '<div class="empty-state">Sem dados de benchmarking disponíveis.</div>';
  // Assunção: coluna B = valor da tua empresa, coluna C = média do setor, coluna D = unidade (ex: "%")
  const keys = Object.keys(b).filter(k => k !== 'nif' && k !== '_rowIndex');
  if(keys.length < 2) return '<div class="empty-state">Sem dados de benchmarking disponíveis.</div>';
  const empresaVal = Number(b[keys[0]]);
  const setorVal = Number(b[keys[1]]);
  const unidade = b[keys[2]] || '';
  const max = Math.max(empresaVal, setorVal, 1);
  return `
    <div class="bench-row">
      <div class="bench-label">A tua empresa</div>
      <div class="bench-bar-track"><div class="bench-bar-fill" style="width:${Math.round(empresaVal/max*100)}%; background:#2F8F6B;"></div></div>
      <div class="bench-value">${empresaVal}${unidade}</div>
    </div>
    <div class="bench-row">
      <div class="bench-label">Média do setor</div>
      <div class="bench-bar-track"><div class="bench-bar-fill" style="width:${Math.round(setorVal/max*100)}%; background:#8A93A6;"></div></div>
      <div class="bench-value">${setorVal}${unidade}</div>
    </div>
  `;
}

/* ===================== PAINEL ADMIN ===================== */
async function loadAdminList(){
  const c = document.getElementById('app-container');
  c.innerHTML = '<div class="loading">A carregar clientes…</div>';
  document.getElementById('topbar-company').textContent = 'Painel do Contabilista';
  try{
    const r = await apiCall({ action:'adminClients', password: session.adminPassword });
    if(!r.success){ c.innerHTML = '<div class="empty-state">'+ (r.error||'Erro.') +'</div>'; return; }
    c.innerHTML = renderAdminList(r.clients);
  }catch(err){
    c.innerHTML = '<div class="empty-state">'+ err.message +'</div>';
  }
}

function renderAdminList(clients){
  if(!clients || !clients.length) return '<div class="empty-state">Sem clientes registados.</div>';
  const items = clients.map(c => `
    <div class="list-item admin-list-item" onclick="loadAdminDetail('${c.nif}')">
      <div class="li-main">
        <div class="li-title">${c.nome_empresa || c.nif}</div>
        <div class="li-sub">NIF ${c.nif} · ${fmtEUR(c.faturacao_dir)}</div>
      </div>
      ${c.obrigacoes_pendentes ? `<span class="badge pendente">${c.obrigacoes_pendentes} pendente(s)</span>` : `<span class="badge pago">em dia</span>`}
    </div>
  `).join('');
  return `<section class="block"><div class="block-title">Clientes</div>${items}</section>`;
}

async function loadAdminDetail(nif){
  const c = document.getElementById('app-container');
  c.innerHTML = '<div class="loading">A carregar cliente…</div>';
  try{
    const r = await apiCall({ action:'adminClientDetail', password: session.adminPassword, nif });
    if(!r.success){ c.innerHTML = '<div class="empty-state">'+ (r.error||'Erro.') +'</div>'; return; }
    document.getElementById('topbar-company').textContent = r.empresa || nif;
    const runwayMeses = estimateRunway(r.metrics || {});
    const alerts = computeAlerts(r.deadlines, r.movimentos, runwayMeses);
    c.innerHTML = `
      <button class="back-btn" onclick="loadAdminList()">← Todos os clientes</button>
      ${renderAlerts(alerts)}
      ${renderKpiGridFixed(r.metrics || {})}
      ${renderDeadlinesHeader(r)}
      ${renderSection('Prazos fiscais', renderDeadlinesAdmin(r.deadlines, nif))}
      ${renderSection('Movimentos', renderMovimentosAdmin(r.movimentos, nif))}
      ${renderSection('Vendas mensais', renderVendas(r.vendas))}
      ${renderSection('Itens comprados', renderItensComprados(r.itensComprados))}
    `;
  }catch(err){
    c.innerHTML = '<div class="empty-state">'+ err.message +'</div>';
  }
}

function renderDeadlinesAdmin(deadlines, nif){
  if(!deadlines || !deadlines.length) return '<div class="empty-state">Sem prazos fiscais.</div>';
  return deadlines.map(d => {
    const estado = String(d.estado || 'pendente').toLowerCase();
    return `<div class="list-item">
      <div class="li-main">
        <div class="li-title">${d.tipo || d.descricao || 'Obrigação'}</div>
        <div class="li-sub">${d.data || ''}</div>
      </div>
      <select class="estado-select" onchange="setDeadlineEstado('${nif}', ${d._rowIndex}, this.value)">
        <option value="pendente" ${estado==='pendente'?'selected':''}>pendente</option>
        <option value="pago" ${estado==='pago'?'selected':''}>pago</option>
        <option value="atrasado" ${estado==='atrasado'?'selected':''}>atrasado</option>
      </select>
    </div>`;
  }).join('');
}

function renderMovimentosAdmin(movimentos, nif){
  if(!movimentos || !movimentos.length) return '<div class="empty-state">Sem movimentos.</div>';
  return movimentos.slice().reverse().map(m => {
    const estado = String(m.estado || 'pendente').toLowerCase();
    return `<div class="list-item">
      <div class="li-main">
        <div class="li-title">${m.descricao || m.tipo}</div>
        <div class="li-sub">${m.data || ''} · ${fmtEUR(m.valor)}</div>
      </div>
      <select class="estado-select" onchange="setMovimentoEstado('${nif}', ${m._rowIndex}, this.value)">
        <option value="pendente" ${estado==='pendente'?'selected':''}>pendente</option>
        <option value="aprovado" ${estado==='aprovado'?'selected':''}>aprovado</option>
      </select>
    </div>`;
  }).join('');
}

function renderItensComprados(itens){
  if(!itens || !itens.length) return '<div class="empty-state">Sem itens registados.</div>';
  return itens.map(i => `
    <div class="list-item">
      <div class="li-main">
        <div class="li-title">${i.descricao || i.nome_fornecedor}</div>
        <div class="li-sub">${i.data_compra || ''} · qtd ${i.quantidade || ''} · ${fmtEUR(i.valor_total)}</div>
      </div>
    </div>
  `).join('');
}

async function setDeadlineEstado(nif, rowIndex, novoEstado){
  await apiCall({ action:'updateDeadlineEstado', password: session.adminPassword, nif, rowIndex, novoEstado });
}
async function setMovimentoEstado(nif, rowIndex, novoEstado){
  await apiCall({ action:'updateMovimentoEstado', password: session.adminPassword, nif, rowIndex, novoEstado });
}
</script>
